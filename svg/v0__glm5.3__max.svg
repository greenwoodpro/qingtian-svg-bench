<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7fd4"/>
      <stop offset="45%" stop-color="#6db3e8"/>
      <stop offset="75%" stop-color="#a8d4f0"/>
      <stop offset="100%" stop-color="#f2e8c9"/>
    </linearGradient>
    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd76e" stop-opacity="0"/>
    </radialGradient>
    <!-- 云朵渐变 -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcebf7"/>
    </linearGradient>
    <!-- 远山 -->
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fc4dd"/>
      <stop offset="100%" stop-color="#c9dcea"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba869"/>
      <stop offset="100%" stop-color="#a9c58a"/>
    </linearGradient>
    <!-- 草地 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbb6e"/>
      <stop offset="100%" stop-color="#5d9148"/>
    </linearGradient>
    <!-- 柏油路 -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e6e74"/>
      <stop offset="100%" stop-color="#4a4a50"/>
    </linearGradient>
    <!-- 校舍墙 -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6efdd"/>
      <stop offset="100%" stop-color="#e2d5b8"/>
    </linearGradient>
    <!-- 屋顶 -->
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3543f"/>
      <stop offset="100%" stop-color="#8f3f2e"/>
    </linearGradient>
    <!-- 少年剪影 -->
    <linearGradient id="boy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b33"/>
      <stop offset="100%" stop-color="#15151b"/>
    </linearGradient>
    <!-- 吉他 -->
    <linearGradient id="guitarBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d99a4e"/>
      <stop offset="60%" stop-color="#b5762f"/>
      <stop offset="100%" stop-color="#8a5520"/>
    </linearGradient>
    <!-- 单车 -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e6fa8"/>
      <stop offset="100%" stop-color="#274d7c"/>
    </linearGradient>
    <!-- 树冠 -->
    <radialGradient id="tree" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6faf5a"/>
      <stop offset="100%" stop-color="#3f7a3a"/>
    </radialGradient>
    <!-- 光斑滤镜 -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- 颗粒质感 -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="900" height="1200" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="640" cy="330" r="230" fill="url(#sunGlow)"/>
  <circle cx="640" cy="330" r="64" fill="#fff6d5"/>
  <circle cx="640" cy="330" r="52" fill="#ffefb0"/>

  <!-- 高层卷云 -->
  <g fill="#ffffff" opacity="0.75" filter="url(#soft2)">
    <ellipse cx="180" cy="180" rx="150" ry="16"/>
    <ellipse cx="420" cy="130" rx="200" ry="14"/>
    <ellipse cx="720" cy="200" rx="160" ry="12"/>
    <ellipse cx="300" cy="250" rx="180" ry="10"/>
  </g>

  <!-- 主体积云 -->
  <g fill="url(#cloud)">
    <!-- 云1 -->
    <g transform="translate(120,320) scale(1.1)">
      <path d="M0,40 Q-10,10 25,5 Q30,-20 60,-12 Q75,-32 100,-15 Q130,-25 140,0 Q170,-5 168,22 Q185,30 170,45 L-5,48 Q-15,45 0,40 Z"/>
    </g>
    <!-- 云2 -->
    <g transform="translate(560,180) scale(0.8)">
      <path d="M0,40 Q-10,10 25,5 Q30,-20 60,-12 Q75,-32 100,-15 Q130,-25 140,0 Q170,-5 168,22 Q185,30 170,45 L-5,48 Q-15,45 0,40 Z"/>
    </g>
    <!-- 云3 -->
    <g transform="translate(680,470) scale(0.65)" opacity="0.9">
      <path d="M0,40 Q-10,10 25,5 Q30,-20 60,-12 Q75,-32 100,-15 Q130,-25 140,0 Q170,-5 168,22 Q185,30 170,45 L-5,48 Q-15,45 0,40 Z"/>
    </g>
    <!-- 云4 -->
    <g transform="translate(60,560) scale(0.55)" opacity="0.85">
      <path d="M0,40 Q-10,10 25,5 Q30,-20 60,-12 Q75,-32 100,-15 Q130,-25 140,0 Q170,-5 168,22 Q185,30 170,45 L-5,48 Q-15,45 0,40 Z"/>
    </g>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#3a4a5a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M300,300 q10,-8 20,0 q10,-8 20,0"/>
    <path d="M350,270 q8,-6 16,0 q8,-6 16,0"/>
    <path d="M260,340 q7,-5 14,0 q7,-5 14,0"/>
  </g>

  <!-- ===== 远景山丘 ===== -->
  <path d="M0,640 Q150,560 300,620 Q450,680 600,610 Q750,545 900,630 L900,760 L0,760 Z" fill="url(#hillFar)"/>

  <!-- ===== 校园建筑 ===== -->
  <g>
    <!-- 主体教学楼 -->
    <rect x="90" y="470" width="330" height="190" rx="4" fill="url(#wall)"/>
    <path d="M80,472 L255,415 L430,472 Z" fill="url(#roof)"/>
    <rect x="80" y="466" width="350" height="10" rx="3" fill="#7a3527"/>
    <!-- 走廊柱 -->
    <g fill="#e8dcc0">
      <rect x="104" y="500" width="12" height="160"/>
      <rect x="164" y="500" width="12" height="160"/>
      <rect x="224" y="500" width="12" height="160"/>
      <rect x="284" y="500" width="12" height="160"/>
      <rect x="344" y="500" width="12" height="160"/>
      <rect x="398" y="500" width="12" height="160"/>
    </g>
    <rect x="104" y="492" width="306" height="10" fill="#c9b893"/>
    <!-- 窗户 -->
    <g fill="#7fb2d9" stroke="#8a7a5c" stroke-width="2">
      <rect x="126" y="520" width="34" height="42" rx="2"/>
      <rect x="186" y="520" width="34" height="42" rx="2"/>
      <rect x="246" y="520" width="34" height="42" rx="2"/>
      <rect x="306" y="520" width="34" height="42" rx="2"/>
      <rect x="366" y="520" width="34" height="42" rx="2"/>
    </g>
    <!-- 窗格反光 -->
    <g stroke="#ffffff" stroke-width="3" opacity="0.55">
      <line x1="130" y1="558" x2="156" y2="524"/>
      <line x1="190" y1="558" x2="216" y2="524"/>
      <line x1="250" y1="558" x2="276" y2="524"/>
      <line x1="310" y1="558" x2="336" y2="524"/>
      <line x1="370" y1="558" x2="396" y2="524"/>
    </g>
    <!-- 二排小窗 -->
    <g fill="#9cc4e2" stroke="#8a7a5c" stroke-width="1.5">
      <rect x="126" y="576" width="34" height="30" rx="2"/>
      <rect x="186" y="576" width="34" height="30" rx="2"/>
      <rect x="246" y="576" width="34" height="30" rx="2"/>
      <rect x="306" y="576" width="34" height="30" rx="2"/>
      <rect x="366" y="576" width="34" height="30" rx="2"/>
    </g>
    <!-- 侧楼 -->
    <rect x="430" y="520" width="120" height="140" rx="4" fill="url(#wall)"/>
    <path d="M424,522 L490,482 L556,522 Z" fill="url(#roof)"/>
    <g fill="#7fb2d9" stroke="#8a7a5c" stroke-width="2">
      <rect x="448" y="545" width="30" height="36" rx="2"/>
      <rect x="502" y="545" width="30" height="36" rx="2"/>
      <rect x="448" y="596" width="30" height="36" rx="2"/>
      <rect x="502" y="596" width="30" height="36" rx="2"/>
    </g>
    <!-- 旗杆 -->
    <line x1="255" y1="415" x2="255" y2="330" stroke="#9a9aa2" stroke-width="4"/>
    <path d="M255,332 L305,342 L255,352 Z" fill="#d9534f"/>
  </g>

  <!-- 电线杆与电线 -->
  <g>
    <rect x="700" y="430" width="10" height="240" fill="#6b5b4a"/>
    <rect x="688" y="445" width="34" height="8" fill="#5a4c3e"/>
    <rect x="688" y="470" width="34" height="8" fill="#5a4c3e"/>
    <path d="M704,449 Q450,505 180,470" stroke="#3a3a42" stroke-width="2.5" fill="none"/>
    <path d="M704,473 Q450,530 180,495" stroke="#3a3a42" stroke-width="2.5" fill="none"/>
    <!-- 停在电线上的鸟 -->
    <path d="M480,497 q6,-10 12,0 q-2,8 -6,8 q-4,0 -6,-8 Z" fill="#2e2e36"/>
    <path d="M492,497 q4,-6 8,-2 q-3,1 -8,2 Z" fill="#2e2e36"/>
  </g>

  <!-- ===== 草地与道路 ===== -->
  <path d="M0,655 Q450,625 900,660 L900,900 L0,900 Z" fill="url(#grass)"/>
  <rect x="0" y="820" width="900" height="180" fill="url(#road)"/>
  <!-- 路面透视 -->
  <path d="M0,820 L900,820 L900,836 L0,836 Z" fill="#7d7d84" opacity="0.6"/>
  <!-- 虚线中线 -->
  <g fill="#e8e2c8" opacity="0.85">
    <rect x="60" y="880" width="90" height="10" rx="4" transform="skewX(-18)"/>
    <rect x="290" y="880" width="90" height="10" rx="4" transform="skewX(-18)"/>
    <rect x="520" y="880" width="90" height="10" rx="4" transform="skewX(-18)"/>
    <rect x="750" y="880" width="90" height="10" rx="4" transform="skewX(-18)"/>
  </g>

  <!-- 草丛 -->
  <g stroke="#4e8a3f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40,700 q-4,-16 -12,-22 M48,702 q0,-18 -4,-26 M56,700 q6,-14 14,-20"/>
    <path d="M820,690 q-4,-16 -12,-22 M828,692 q0,-18 -4,-26 M836,690 q6,-14 14,-20"/>
    <path d="M640,672 q-4,-14 -10,-19 M648,674 q0,-16 -4,-23"/>
  </g>
  <!-- 小花 -->
  <g fill="#f5f0dc">
    <circle cx="46" cy="676" r="4"/><circle cx="826" cy="666" r="4"/><circle cx="646" cy="651" r="3"/>
  </g>
  <g fill="#e8b64c">
    <circle cx="46" cy="676" r="1.6"/><circle cx="826" cy="666" r="1.6"/><circle cx="646" cy="651" r="1.4"/>
  </g>

  <!-- ===== 大树（左前景）===== -->
  <g>
    <path d="M120,830 q-14,-90 -6,-160 q4,-40 -10,-70 l30,0 q-8,34 -4,70 q10,70 -2,160 Z" fill="#6b4a34"/>
    <path d="M132,700 q30,-20 55,-10" stroke="#6b4a34" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M126,760 q-34,-16 -55,-8" stroke="#6b4a34" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g fill="url(#tree)">
      <ellipse cx="120" cy="560" rx="120" ry="85"/>
      <ellipse cx="60" cy="610" rx="70" ry="50"/>
      <ellipse cx="190" cy="615" rx="75" ry="52"/>
      <ellipse cx="150" cy="520" rx="70" ry="48"/>
    </g>
    <!-- 树叶光斑 -->
    <g fill="#a9d98f" opacity="0.7" filter="url(#soft)">
      <ellipse cx="90" cy="530" rx="26" ry="16"/>
      <ellipse cx="170" cy="560" rx="30" ry="14"/>
      <ellipse cx="130" cy="600" rx="24" ry="12"/>
    </g>
  </g>

  <!-- ===== 单车（倒在草地上）===== -->
  <g transform="translate(690,760) rotate(-8)">
    <!-- 车轮 -->
    <g stroke="#33333b" stroke-width="7" fill="none">
      <circle cx="0" cy="0" r="52"/>
      <circle cx="120" cy="0" r="52"/>
    </g>
    <g stroke="#8a8a92" stroke-width="2" fill="none">
      <circle cx="0" cy="0" r="44"/><circle cx="0" cy="0" r="10"/>
      <circle cx="120" cy="0" r="44"/><circle cx="120" cy="0" r="10"/>
    </g>
    <g stroke="#77777f" stroke-width="1.5">
      <line x1="0" y1="-44" x2="0" y2="44"/><line x1="-44" y1="0" x2="44" y2="0"/>
      <line x1="-31" y1="-31" x2="31" y2="31"/><line x1="-31" y1="31" x2="31" y2="-31"/>
      <line x1="120" y1="-44" x2="120" y2="44"/><line x1="76" y1="0" x2="164" y2="0"/>
      <line x1="89" y1="-31" x2="151" y2="31"/><line x1="89" y1="31" x2="151" y2="-31"/>
    </g>
    <!-- 车架 -->
    <g stroke="url(#frame)" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M0,0 L38,-52 L96,-52 L120,0"/>
      <path d="M38,-52 L52,0 L0,0"/>
      <path d="M96,-52 L110,-88"/>
    </g>
    <!-- 车座与把手 -->
    <path d="M100,-92 q22,-6 30,4 q-14,6 -30,2 Z" fill="#2c2c34"/>
    <rect x="30" y="-62" width="26" height="9" rx="4" fill="#2c2c34"/>
    <!-- 车筐 -->
    <g transform="translate(112,-84)">
      <path d="M-4,0 L26,0 L22,20 L0,20 Z" fill="none" stroke="#8a6a3f" stroke-width="3"/>
      <path d="M-4,7 L26,7 M-4,14 L25,14 M6,0 L7,20 M16,0 L15,20" stroke="#8a6a3f" stroke-width="2"/>
    </g>
  </g>

  <!-- ===== 少年剪影（坐在草地上弹吉他）===== -->
  <g transform="translate(390,730)">
    <!-- 影子 -->
    <ellipse cx="30" cy="118" rx="120" ry="16" fill="#2a3a2a" opacity="0.35" filter="url(#soft)"/>
    <!-- 腿（盘坐） -->
    <path d="M-10,96 Q-40,110 -18,116 Q20,124 60,112 Q30,104 22,92 Z" fill="url(#boy)"/>
    <path d="M28,94 Q60,104 88,112 Q60,120 30,116 Q18,106 16,92 Z" fill="url(#boy)"/>
    <!-- 身体 -->
    <path d="M-6,96 Q-16,60 -6,42 Q2,28 22,28 Q38,28 44,44 Q50,64 44,96 Q20,104 -6,96 Z" fill="url(#boy)"/>
    <!-- 手臂（抱吉他） -->
    <path d="M6,50 Q-16,66 -8,84 Q0,90 8,80 Q2,68 14,56 Z" fill="url(#boy)"/>
    <path d="M40,52 Q58,66 66,84 Q74,90 80,82 Q74,64 56,50 Z" fill="url(#boy)"/>
    <!-- 头 -->
    <circle cx="20" cy="8" r="22" fill="url(#boy)"/>
    <!-- 头发 -->
    <path d="M-2,2 Q-6,-16 12,-20 Q34,-24 42,-8 Q46,2 44,10 Q40,-4 30,-6 Q36,2 30,10 Q24,-2 14,-2 Q6,-2 2,8 Q-2,6 -2,2 Z" fill="#101016"/>
    <!-- 吉他琴身 -->
    <g transform="translate(30,62) rotate(18)">
      <path d="M0,0 Q-26,-6 -30,14 Q-34,36 -12,42 Q10,48 20,32 Q28,18 14,8 Q8,2 0,0 Z" fill="url(#guitarBody)" stroke="#6e4318" stroke-width="2"/>
      <circle cx="-6" cy="22" r="7" fill="#3a2410"/>
      <path d="M-2,4 L-2,-58" stroke="#3a2410" stroke-width="5"/>
      <rect x="-14" y="-70" width="24" height="14" rx="3" fill="#2c2c34"/>
      <g stroke="#d8d8de" stroke-width="1.2">
        <line x1="-6" y1="-66" x2="-6" y2="30"/>
        <line x1="-1" y1="-66" x2="-1" y2="30"/>
        <line x1="-11" y1="-66" x2="-11" y2="30"/>
      </g>
      <!-- 品格 -->
      <g stroke="#c9b28a" stroke-width="1">
        <line x1="-13" y1="-50" x2="1" y2="-50"/>
        <line x1="-13" y1="-38" x2="1" y2="-38"/>
        <line x1="-13" y1="-26" x2="1" y2="-26"/>
        <line x1="-13" y1="-14" x2="1" y2="-14"/>
      </g>
    </g>
  </g>

  <!-- 飘落的吉他拨片 / 音符 -->
  <g fill="#f2e8c9" opacity="0.9">
    <path d="M520,600 q10,-14 20,0 q-6,12 -10,12 q-6,0 -10,-12 Z"/>
    <path d="M560,640 q8,-11 16,0 q-5,10 -8,10 q-5,0 -8,-10 Z"/>
  </g>
  <g stroke="#f2e8c9" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M540,612 q14,-10 26,2 M540,612 q-2,-14 10,-20"/>
    <path d="M578,650 q12,-8 22,2"/>
  </g>

  <!-- ===== 底部暗角与光效 ===== -->
  <rect x="0" y="820" width="900" height="380" fill="#1c2430" opacity="0.55"/>
  <rect x="0" y="820" width="900" height="380" fill="url(#sky)" opacity="0"/>
  <!-- 镜头光斑 -->
  <g opacity="0.5">
    <circle cx="180" cy="240" r="26" fill="#ffe9a8" opacity="0.35" filter="url(#soft)"/>
    <circle cx="240" cy="380" r="14" fill="#bfe0ff" opacity="0.4" filter="url(#soft)"/>
    <circle cx="150" cy="520" r="18" fill="#ffd7a0" opacity="0.3" filter="url(#soft)"/>
    <circle cx="820" cy="300" r="20" fill="#bfe0ff" opacity="0.3" filter="url(#soft)"/>
  </g>

  <!-- ===== 标题排版 ===== -->
  <g>
    <!-- 英文小字 -->
    <text x="450" y="920" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="14" fill="#e8dfc4" opacity="0.9">SUNNY DAY</text>
    <line x1="330" y1="938" x2="570" y2="938" stroke="#e8dfc4" stroke-width="1" opacity="0.6"/>
    <!-- 主标题 -->
    <text x="450" y="1035" text-anchor="middle" font-family="'Songti SC','SimSun','Noto Serif SC',serif" font-size="130" font-weight="bold" fill="#fdf6e0" stroke="#8a6a3f" stroke-width="2">晴天</text>
    <!-- 副标题 -->
    <text x="450" y="1090" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="24" letter-spacing="8" fill="#d8cfb2">周杰伦 · 词曲创作专辑</text>
    <!-- 装饰音符 -->
    <g stroke="#fdf6e0" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M300,1010 q10,-8 20,0 M300,1010 q-2,-12 8,-18"/>
      <path d="M600,1010 q10,-8 20,0 M600,1010 q-2,-12 8,-18"/>
    </g>
    <circle cx="300" cy="1012" r="4.5" fill="#fdf6e0"/>
    <circle cx="600" cy="1012" r="4.5" fill="#fdf6e0"/>
    <!-- 底部标语 -->
    <text x="450" y="1150" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="17" letter-spacing="4" fill="#b8ae90" opacity="0.9">「刮风这天 我试过握着你手」</text>
  </g>

  <!-- 胶片颗粒 -->
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.5"/>
</svg>
